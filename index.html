<body>
    <div id="app" class="app-shell">
        <header id="site-header" class="site-header"></header>
        <main id="main-content" class="main-content" tabindex="-1"></main>
        <footer class="site-footer"><span>© <span id="year"></span> PyQuest</span><span data-i18n="footer">Small Python puzzles and quick quizzes.</span></footer>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <noscript>PyQuest memerlukan JavaScript. / PyQuest needs JavaScript.</noscript>
    <script>
    /* Pemuat fail: cari di beberapa folder supaya laman tetap jalan walaupun fail tersalah letak. */
    (function () {
      var jobs = [
        ['questions.js', ['data/', '', 'assets/js/']],
        ['puzzles.js', ['data/', '', 'assets/js/']],
        ['puzzles-extra.js', ['data/', '', 'assets/js/']],
        ['questions-extra.js', ['data/', '', 'assets/js/']],
        ['engine-update-2.js', ['assets/js/', '']],
        ['app-update-2.js', ['assets/js/', '']]
      ], missing = [];
      function warn() {
        if (!missing.length) return;
        var box = document.createElement('div');
        box.setAttribute('role', 'alert');
        box.style.cssText = 'background:#faeceb;color:#86261f;border-bottom:3px solid #b0352d;padding:12px 20px;font:14px/1.5 sans-serif;text-align:center';
        box.textContent = 'Fail tidak dijumpai / File not found: ' + missing.join(', ') + ' \u2014 muat naik ke folder yang betul di GitHub.';
        document.body.insertBefore(box, document.body.firstChild);
      }
      function run(i) {
        if (i >= jobs.length) { warn(); return; }
        var name = jobs[i][0], dirs = jobs[i][1], k = 0;
        (function tryNext() {
          if (k >= dirs.length) { missing.push(dirs[0] + name); if (i < 4) run(i + 1); else warn(); return; }
          var s = document.createElement('script');
          s.src = dirs[k++] + name;
          s.onload = function () { run(i + 1); };
          s.onerror = function () { if (s.parentNode) s.parentNode.removeChild(s); tryNext(); };
          document.body.appendChild(s);
        })();
      }
      run(0);
    })();
    </script>
</body>
</html>
