    <script>
    /* Pemuat fail: cari di beberapa folder supaya laman tetap jalan walaupun fail tersalah letak.
       Tahap 0 = data/pilihan (amaran sahaja), 1 = senyap jika tiada (konfigurasi), 2 = wajib (laman berhenti). */
    (function () {
      var D = ['data/', '', 'assets/js/'], J = ['assets/js/', ''];
      var jobs = [
        ['questions-update-7.js', D, 0], ['puzzles-update-7.js', D, 0], ['notes-update-8.js', D, 0],
        ['info-update-8.js', J, 0], ['firebase-config-update-3.js', J, 1], ['auth-update-13.js', J, 0], ['analytics-update-4.js', J, 0], ['mp-update-8.js', J, 0], ['bank-update-11.js', J, 0],
        ['skins-update-14.js', J, 2], ['art-update-14.js', J, 2], ['fx-update-7.js', J, 0], ['engine-update-13.js', J, 2], ['app-update-14.js', J, 2]
      ], missing = [];
      function warn() {
        if (!missing.length) return;
        var box = document.createElement('div');
        box.setAttribute('role', 'alert');
        box.style.cssText = 'background:#faeceb;color:#86261f;border-bottom:3px solid #b0352d;padding:12px 20px;font:14px/1.5 sans-serif;text-align:center';
        box.textContent = 'Fail tidak dijumpai / File not found: ' + missing.join(', ') + ' \u2014 muat naik ke folder yang betul di GitHub.';
        document.body.insertBefore(box, document.body.firstChild);
      }
      function run(i) {
        if (i >= jobs.length) { warn(); return; }
        var name = jobs[i][0], dirs = jobs[i][1], level = jobs[i][2], k = 0;
        (function tryNext() {
          if (k >= dirs.length) {
            if (level !== 1) missing.push(dirs[0] + name);
            if (level === 2) warn(); else run(i + 1);
            return;
          }
          var s = document.createElement('script');
          s.src = dirs[k++] + name;
          s.onload = function () { run(i + 1); };
          s.onerror = function () { if (s.parentNode) s.parentNode.removeChild(s); tryNext(); };
          document.body.appendChild(s);
        })();
      }
      run(0);
    })();
    </script>
